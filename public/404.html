<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8">
    <title>خدر ليالي الانس</title>
    <script>
      // Automatically redirect GitHub Pages 404 back to root SPA
      sessionStorage.redirect = location.href;
      var path = window.location.pathname;
      var repo = path.split('/')[1] || '';
      var target = repo ? '/' + repo + '/' : '/';
      window.location.replace(target);
    </script>
  </head>
  <body>
    <p>جاري تحويلكم إلى الصفحة الرئيسية للنظام...</p>
  </body>
</html>
